<div class="h-full flex flex-col bg-brand-dark-950 text-brand-text-100 p-6">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="text-xl font-semibold text-brand-text-100">Workflow Statuses</h2>
      <p class="text-xs text-brand-text-400 mt-1">Manage custom statuses for Project Managers and Executives.</p>
    </div>
  </div>

  <!-- Tab Selector -->
  <div class="flex border-b border-brand-dark-800 mb-6 gap-6">
    <button (click)="setTab('pm')" 
            class="pb-3 text-sm font-medium transition-all relative outline-none"
            [class.text-brand-primary]="activeTab === 'pm'"
            [class.text-brand-text-400]="activeTab !== 'pm'">
      Project Manager Statuses
      <div *ngIf="activeTab === 'pm'" class="absolute bottom-0 left-0 right-0 h-0.5 bg-brand-primary"></div>
    </button>
    <button (click)="setTab('developer')" 
            class="pb-3 text-sm font-medium transition-all relative outline-none"
            [class.text-brand-primary]="activeTab === 'developer'"
            [class.text-brand-text-400]="activeTab !== 'developer'">
      Executive Statuses
      <div *ngIf="activeTab === 'developer'" class="absolute bottom-0 left-0 right-0 h-0.5 bg-brand-primary"></div>
    </button>
  </div>

  <div class="bg-brand-dark-900 border border-brand-dark-800 rounded-lg p-5 mb-8">
    <h3 class="text-sm font-medium mb-3">Add New {{ activeTab === 'pm' ? 'PM' : 'Executive' }} Status</h3>
    <div class="flex items-center gap-3">
      <input type="text" [(ngModel)]="newStatusName" placeholder="e.g. In QA Review"
             class="flex-1 bg-brand-dark-950 border border-brand-dark-800 rounded-md px-3 py-1.5 text-sm focus:border-brand-primary outline-none"
             (keydown.enter)="addStatus()">

      <button (click)="addStatus()" [disabled]="!newStatusName || isSubmitting"
              class="bg-brand-primary hover:bg-brand-primary/90 text-white px-4 py-1.5 rounded-md text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed transition">
        {{ isSubmitting ? 'Adding...' : 'Add Status' }}
      </button>
    </div>
  </div>

  <div class="flex-1 bg-brand-dark-900 border border-brand-dark-800 rounded-lg overflow-hidden flex flex-col">
    <div class="grid grid-cols-12 gap-4 p-4 border-b border-brand-dark-800 bg-brand-dark-950/50 text-xs font-semibold text-brand-text-400">
      <div class="col-span-1">ID</div>
      <div class="col-span-9">Status Name</div>
      <div class="col-span-2 text-right">Actions</div>
    </div>
    
    <div class="flex-1 overflow-y-auto">
      <div *ngIf="isLoading" class="p-8 text-center text-brand-text-400 text-sm">
        Loading statuses...
      </div>
      
      <div *ngIf="!isLoading && statuses.length === 0" class="p-8 text-center text-brand-text-400 text-sm">
        No statuses found.
      </div>
      
      <div *ngFor="let s of statuses" class="grid grid-cols-12 gap-4 p-4 border-b border-brand-dark-800 items-center hover:bg-brand-dark-800/50 transition">
        <div class="col-span-1 text-xs text-brand-text-400">#{{ s.id }}</div>
        <div class="col-span-9">
          <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full text-xs font-medium border border-brand-dark-700 bg-brand-dark-950">
            {{ s.statusName }}
          </div>
        </div>
        <div class="col-span-2 text-right">
          <button (click)="deleteStatus(s.id)" class="text-red-400 hover:text-red-300 hover:bg-red-400/10 p-1.5 rounded transition">
            <span class="material-icons text-[16px] block">delete</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

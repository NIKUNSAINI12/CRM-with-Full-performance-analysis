<div class="h-full flex flex-col bg-brand-dark-950 text-brand-text-100 p-6">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h2 class="text-xl font-semibold text-brand-text-100">Priorities & TAT</h2>
      <p class="text-xs text-brand-text-400 mt-1">Manage ticket urgency levels and their automated Turnaround Times (TAT).</p>
    </div>
  </div>

  <div class="bg-brand-dark-900 border border-brand-dark-800 rounded-lg p-5 mb-8">
    <h3 class="text-sm font-medium mb-3">Add New Priority</h3>
    <div class="flex items-center gap-3">
      <input type="text" [(ngModel)]="newPriorityName" placeholder="e.g. Critical"
             class="flex-1 bg-brand-dark-950 border border-brand-dark-800 rounded-md px-3 py-1.5 text-sm focus:border-brand-primary outline-none">
      
      <input type="number" [(ngModel)]="newTatHours" placeholder="TAT (Hours)" min="1"
             class="w-32 bg-brand-dark-950 border border-brand-dark-800 rounded-md px-3 py-1.5 text-sm focus:border-brand-primary outline-none">

      <button (click)="addPriority()" [disabled]="!newPriorityName || !newTatHours || isSubmitting"
              class="bg-brand-primary hover:bg-brand-primary/90 text-white px-4 py-1.5 rounded-md text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed transition">
        {{ isSubmitting ? 'Adding...' : 'Add Priority' }}
      </button>
    </div>
  </div>

  <div class="flex-1 bg-brand-dark-900 border border-brand-dark-800 rounded-lg overflow-hidden flex flex-col">
    <div class="grid grid-cols-12 gap-4 p-4 border-b border-brand-dark-800 bg-brand-dark-950/50 text-xs font-semibold text-brand-text-400">
      <div class="col-span-1">ID</div>
      <div class="col-span-6">Priority Level</div>
      <div class="col-span-3">SLA / TAT</div>
      <div class="col-span-2 text-right">Actions</div>
    </div>
    
    <div class="flex-1 overflow-y-auto">
      <div *ngIf="isLoading" class="p-8 text-center text-brand-text-400 text-sm">
        Loading priorities...
      </div>
      
      <div *ngIf="!isLoading && priorities.length === 0" class="p-8 text-center text-brand-text-400 text-sm">
        No priorities found.
      </div>
      
      <div *ngFor="let p of priorities" class="grid grid-cols-12 gap-4 p-4 border-b border-brand-dark-800 items-center hover:bg-brand-dark-800/50 transition">
        <div class="col-span-1 text-xs text-brand-text-400">#{{ p.id }}</div>
        <div class="col-span-6 font-medium">
          <span class="px-2 py-0.5 bg-brand-dark-700 border border-brand-dark-600 rounded text-xs">{{ p.priorityName }}</span>
        </div>
        <div class="col-span-3">
          <span class="text-xs text-brand-text-100 flex items-center gap-1.5">
            <span class="material-icons text-brand-primary text-sm">schedule</span>
            {{ p.tatHours }} Hours
          </span>
        </div>
        <div class="col-span-2 text-right">
          <button (click)="deletePriority(p.id)" class="text-red-400 hover:text-red-300 hover:bg-red-400/10 p-1.5 rounded transition">
            <span class="material-icons text-[16px] block">delete</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
